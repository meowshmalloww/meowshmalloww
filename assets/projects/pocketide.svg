  <rect x="1" y="1" width="578" height="233" rx="18" fill="#121520" stroke="#3B3546" stroke-width="2"/>
  <path fill="#292337" opacity="0.76" d="M392 0 H580 V168 C512 132 466 170 392 108 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M392 0 H580 V168 C512 132 466 170 392 108 Z;M362 0 H580 V142 C520 190 446 128 362 92 Z;M392 0 H580 V168 C512 132 466 170 392 108 Z"/>
