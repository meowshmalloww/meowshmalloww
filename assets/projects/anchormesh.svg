<svg xmlns="http://www.w3.org/2000/svg" width="580" height="235" viewBox="0 0 580 235" role="img" aria-labelledby="title desc">
  <title id="title">AnchorMesh</title>
  <desc id="desc">Store-and-forward offline mesh network for disaster rescue.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6E897F"/><stop offset="1" stop-color="#8DA1B5"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="578" height="233" rx="18" fill="#0E181D" stroke="#304248" stroke-width="2"/>
  <path fill="#1A3032" opacity="0.74" d="M388 0 H580 V174 C516 140 454 166 388 106 Z">
    <animate attributeName="d" dur="11s" repeatCount="indefinite" values="M388 0 H580 V174 C516 140 454 166 388 106 Z;M360 0 H580 V150 C522 184 448 132 360 90 Z;M388 0 H580 V174 C516 140 454 166 388 106 Z"/>
  </path>
  <text x="514" y="82" text-anchor="middle" fill="none" stroke="#68847E" stroke-opacity="0.42" font-family="Georgia, serif" font-size="92" font-weight="700">03</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="28" y="25" width="100" height="25" rx="6" fill="#1A292D" stroke="#6E897F" stroke-opacity="0.75"/>
    <text x="78" y="42" text-anchor="middle" fill="#BDD0C8" font-size="10" font-weight="700" letter-spacing="1.4">RESILIENCE</text>
    <text x="28" y="91" fill="#F1F0E8" font-family="Georgia, serif" font-size="34" font-weight="700">AnchorMesh</text>
    <text x="28" y="124" fill="#AEC1C2" font-size="14">Store-and-forward BLE mesh for disaster rescue.</text>
    <text x="28" y="146" fill="#80979B" font-size="13">Nearby phones relay compact SOS packets when networks fail.</text>
    <text x="28" y="179" fill="#92B0A5" font-size="10.5" font-weight="700" letter-spacing="1.25">FLUTTER · DART · BLE · OFFLINE-FIRST</text>
    <rect x="28" y="198" width="150" height="2.5" rx="1.25" fill="url(#accent)">
      <animate attributeName="width" values="98;150;120;150;98" dur="7.5s" repeatCount="indefinite"/>
    </rect>
    <text x="202" y="204" fill="#C8D7D4" font-size="10" font-weight="700" letter-spacing="1.3">OPEN REPOSITORY ↗</text>
