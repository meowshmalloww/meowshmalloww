name: Refresh profile assets

"on":
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate bespoke GitHub activity cards
        shell: bash
        env:
          PROFILE_USERNAME: meowshmalloww
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-profile-cards.mjs

      - name: Generate Pac-Man and Breakout contribution games
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: meowshmalloww
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman,breakout
          player_style: opportunistic

      - name: Copy arcade games into profile assets
        shell: bash
        run: |
          cp dist/pacman-contribution-graph.svg assets/pacman-contribution-graph.svg
          cp dist/pacman-contribution-graph-dark.svg assets/pacman-contribution-graph-dark.svg
          cp dist/breakout-contribution-graph.svg assets/breakout-contribution-graph.svg
          cp dist/breakout-contribution-graph-dark.svg assets/breakout-contribution-graph-dark.svg

      - name: Commit refreshed assets
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo "Profile assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git add assets/pacman-contribution-graph*.svg assets/breakout-contribution-graph*.svg
          git commit -m "chore: refresh profile assets"
          git push
